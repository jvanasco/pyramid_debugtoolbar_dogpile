name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install tox
      - run: python -m tox -e py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: .tox/htmlcov/py

  legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["2.7", "3.5", "3.6", "3.7", "3.8"]
    steps:
      - uses: actions/checkout@v4
      - name: Test with the legacy Python image
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          docker run --rm -v "$PWD:/project" -w /project "python:$PYTHON_VERSION" \
            sh -ec 'python -m pip install "tox>=3.24,<4" && python -m tox -e py'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: .tox/htmlcov/py
