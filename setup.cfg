[metadata]
name = pyramid_debugtoolbar_dogpile
version = attr: pyramid_debugtoolbar_dogpile.__VERSION__
url = https://github.com/jvanasco/pyramid_debugtoolbar_dogpile
author = Jonathan Vanasco
author_email = jonathan@findmeon.com
description = dogpile support for pyramid_debugtoolbar
long_description = file: README.md
long_description_content_type = text/markdown
keywords = web, pyramid
license = MIT
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python :: 3.5
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=3.5
packages = find:
package_dir =
    = src
include_package_data = False
zip_safe = False
install_requires =
    dogpile.cache
    pyramid
    pyramid_debugtoolbar>=4.0
    setuptools<82; python_version >= "3.7" and python_version < "3.10"

[options.packages.find]
where = src

[options.package_data]
pyramid_debugtoolbar_dogpile.panels = templates/*.dbtmako

[options.extras_require]
testing =
    coverage
    pytest

[tox:tox]
isolated_build = true
envlist = py35, py36, py37, py38, py39, py310, py311, py312, py313, py314, py315

[testenv]
extras = testing
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage
commands =
    python -m coverage run --source=pyramid_debugtoolbar_dogpile -m pytest {posargs}
    python -m coverage report
    python -m coverage html -d {toxworkdir}/htmlcov/{envname}
